<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate with:
  chrome --headless=new --window-size=1200,630 --screenshot=public/og.png scripts/og.html -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Urbanist:wght@500;600&display=swap");
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0a0a0a; color: #fff; font-family: Urbanist, Arial, sans-serif; position: relative; overflow: hidden; }
  .kente { position: absolute; top: 0; left: 0; right: 0; height: 14px; background: repeating-linear-gradient(90deg,#ce1126 0 40px,#fcd116 40px 80px,#006b3f 80px 120px,#0a0a0a 120px 132px); }
  .wrap { position: relative; padding: 84px 80px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 40px; }
  .brand span { color: #ce1126; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 78px; line-height: 1.02; letter-spacing: -1.5px; max-width: 980px; }
  h1 em { font-style: normal; color: #fcd116; }
  p { font-size: 30px; color: rgba(255,255,255,.72); font-weight: 500; }
  .foot { display: flex; justify-content: space-between; font-size: 26px; color: rgba(255,255,255,.6); font-weight: 600; }
</style>
</head>
<body>
  <div class="kente"></div>
  <div class="wrap">
    <div class="brand">Ghana<span>Logos</span></div>
    <div>
      <h1>Official logos of <em>Ghanaian</em> brands, in SVG &amp; PNG.</h1>
      <p style="margin-top:22px">Banks · Telecoms · Government · Universities · Football · Media</p>
    </div>
    <div class="foot"><span>ghanalogos.com</span><span>Official logos · 15 categories</span></div>
  </div>
</body>
</html>
